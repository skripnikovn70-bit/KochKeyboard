      - name: Generate dictionaries
        run: |
          sudo apt-get update -y > /dev/null || true
          sudo apt-get install -y hunspell-en-us > /dev/null
          sudo apt-get install -y hunspell-ru > /dev/null || echo "no hunspell-ru"
          sudo apt-get install -y hunspell-tools > /dev/null || echo "no hunspell-tools"
          ls /usr/share/hunspell | head -20
          cd proj
          mkdir -p app/src/main/assets
          python3 gen_dict.py

      - name: Check signing secrets
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets found: a signed release APK will be built." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing skipped: add GitHub Secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (Settings > Secrets and variables > Actions). The debug APK is still built."
            echo "Release signing SKIPPED: secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD are not set. Only the debug APK is built." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Lint
        id: lint
        continue-on-error: true
        run: cd proj && gradle :app:lintDebug --no-daemon

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: cd proj && gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: cd proj && gradle :app:assembleDebug --no-daemon

      - name: Build signed release APK
        if: steps.sign.outputs.have == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cd proj && gradle :app:assembleRelease --no-daemon

      - name: Verify APK files
        run: |
          set -e
          ls -la proj/app/build/outputs/apk/debug/*.apk
          if [ "${{ steps.sign.outputs.have }}" = "true" ]; then
            ls -la proj/app/build/outputs/apk/release/*.apk
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)
            "$APKSIGNER" verify --print-certs proj/app/build/outputs/apk/release/*.apk | head -3
          fi

      - name: Summary
        if: always()
        run: |
          echo "Lint: ${{ steps.lint.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Unit tests: ${{ steps.tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          ls -la proj/app/build/outputs/apk/*/ >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        with:
          name: KochKeyboard-debug-apk
          path: proj/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.have == 'true'
        with:
          name: KochKeyboard-release-apk
          path: proj/app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            proj/app/build/reports/
          if-no-files-found: ignore

      - name: Fail if unit tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Unit tests failed - see the 'reports' artifact. APKs were still uploaded."
          exit 1
