          ls

      - name: Generate dictionaries
        run: |
          sudo apt-get update -y > /dev/null || true
          sudo apt-get install -y hunspell-en-us > /dev/null
          sudo apt-get install -y hunspell-ru > /dev/null || echo "no hunspell-ru"
          sudo apt-get install -y hunspell-tools > /dev/null || echo "no hunspell-tools"
          ls /usr/share/hunspell | head -20
          cd proj
          mkdir -p app/src/main/assets
          python3 gen_dict.py

      - name: Prepare release signing
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            SRC="GitHub Secrets (stable key: updates install over each other)"
            KP="$KEYSTORE_PASSWORD"; KA="$KEY_ALIAS"; KK="$KEY_PASSWORD"
          else
            # Секретов нет: одноразовый ключ только на время этой сборки, нигде не хранится.
            KP="$(openssl rand -hex 16)"; KA="koch"; KK="$KP"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -alias "$KA"               -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KP" -keypass "$KK"               -dname "CN=Koch Keyboard CI, O=Koch, C=RU" > /dev/null
            SRC="temporary key generated for this build (differs every build: uninstall the old app before installing a new one)"
            echo "::notice::Release signed with a temporary key. Add KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets to keep a stable signature."
          fi
          echo "::add-mask::$KP"; echo "::add-mask::$KK"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$KP"
            echo "KEY_ALIAS=$KA"
            echo "KEY_PASSWORD=$KK"
          } >> "$GITHUB_ENV"
          echo "have=true" >> "$GITHUB_OUTPUT"
          echo "Release signing: $SRC" >> "$GITHUB_STEP_SUMMARY"

      - name: Lint
        id: lint
        continue-on-error: true
        run: cd proj && gradle :app:lintDebug --no-daemon

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: cd proj && gradle :app:testDebugUnitTest --no-daemon

      - name: Build signed release APK
        if: steps.sign.outputs.have == 'true'
        run: cd proj && gradle :app:assembleRelease --no-daemon

      - name: Verify and collect the APK
        run: |
          set -e
          APK=$(ls proj/app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -3
          mkdir -p dist
          cp "$APK" dist/KochKeyboard-V3-Beta-Remastered.apk
          ls -la dist

      - name: Summary
        if: always()
        run: |
          echo "Lint: ${{ steps.lint.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Unit tests: ${{ steps.tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          ls -la dist >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        with:
          name: KochKeyboard-V3-Beta-Remastered
          path: dist/KochKeyboard-V3-Beta-Remastered.apk

      - uses: actions/upload-artifact@v4
        if: failure() || steps.tests.outcome == 'failure'
        with:
          name: reports
          path: proj/app/build/reports/
          if-no-files-found: ignore

      - name: Fail if unit tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Unit tests failed - see the 'reports' artifact. APKs were still uploaded."
          exit 1
