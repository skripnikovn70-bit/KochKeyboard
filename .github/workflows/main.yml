          def verb_forms(lemma):
              reflexive = lemma.endswith("ся")
              inf = lemma[:-2] if reflexive else lemma   # drop 'ся'
              f = [inf]
              if inf.endswith(("овать", "евать")):
                  st = inf[:-5] + ("у" if inf.endswith("овать") else "ю")
                  f += [st + e for e in ["ю", "ешь", "ет", "ем", "ете", "ют"]] if False else []
                  base = inf[:-5]
                  f += [base + "ую", base + "уешь", base + "ует", base + "уем", base + "уете", base + "уют"]
                  f += [inf[:-2] + s for s in ["л", "ла", "ло", "ли"]] + [base + "уй", base + "уйте"]
              elif inf.endswith(("ать", "ять")):
                  st = inf[:-2]
                  f += [st + e for e in ["ю", "ешь", "ет", "ем", "ете", "ют", "л", "ла", "ло", "ли", "й", "йте", "я"]]
                  # consonant-mutation classes: писать/искать -> handled in plain list
              elif inf.endswith("еть") :
                  st = inf[:-3]
                  f += [st + e for e in ["ею", "еешь", "еет", "еем", "еете", "еют", "ел", "ела", "ело", "ели", "ей", "ейте"]]
                  f += [st + e for e in ["ю", "ишь", "ит", "им", "ите", "ят", "ел", "ела", "ело", "ели", "и", "ите"]]
              elif inf.endswith("ить"):
                  st = inf[:-3]
                  f += [st + e for e in ["ю", "ишь", "ит", "им", "ите", "ят", "ил", "ила", "ило", "или", "и", "ите"]]
              elif inf.endswith("ыть") or inf.endswith("уть"):
                  st = inf[:-2]
                  f += [st + e for e in ["ю", "ешь", "ет", "ем", "ете", "ют", "л", "ла", "ло", "ли", "й", "йте"]]
              elif inf.endswith("ть"):
                  st = inf[:-2]
                  f += [st + e for e in ["ешь", "ет", "ем", "ете", "л", "ла", "ло", "ли"]]
              return refl(f, reflexive)

          def noun_m(l):
              if l.endswith("ь"):
                  s = l[:-1]; return [l] + [s + e for e in ["я", "ю", "ем", "е", "и", "ей", "ям", "ями", "ях", "ь"]]
              if l.endswith("й"):
                  s = l[:-1]; return [l] + [s + e for e in ["я", "ю", "ем", "е", "и", "ев", "ям", "ями", "ях"]]
              sib = l[-1] in "жшчщ"
              soft1 = sib or l[-1] in "гкх"
              return [l] + [l + e for e in ["а", "у", "ем" if sib else "ом", "е", "и" if soft1 else "ы", "ей" if sib else "ов", "ам", "ами", "ах", "ы", "и", "ов"]]

          def noun_f(l):
              if l.endswith("а"):
                  s = l[:-1]; i = "и" if s[-1] in "гкхжшчщ" else "ы"
                  return [l] + [s + e for e in ["у", i, "е", "ой", "ою", "ам", "ами", "ах", "", "ей", "ы", "и"]]
              if l.endswith("я"):
                  s = l[:-1]; return [l] + [s + e for e in ["ю", "и", "е", "ей", "ею", "ям", "ями", "ях", "ь", "й"]]
              if l.endswith("ь"):
                  s = l[:-1]; return [l] + [s + e for e in ["и", "ью", "ей", "ям", "ями", "ях", "е"]]
              return [l]

          def noun_n(l):
              if l.endswith("о"):
                  s = l[:-1]; return [l] + [s + e for e in ["а", "у", "ом", "е", "ам", "ами", "ах", "", "ов", "и"]]
              if l.endswith("е"):
                  s = l[:-1]; return [l] + [s + e for e in ["я", "ю", "ем", "и", "й", "ей", "ям", "ями", "ях", "ё"]]
              return [l]

          def adj(l):
              if l.endswith(("ый", "ой")):
                  s = l[:-2]
                  if s[-1] in "гкхжшчщ":
                      es = ["ий", "ая", "ое", "ие", "ого", "ому", "им", "ой", "ую", "ом", "их", "ими", "о", "а", "и"]
                  else:
                      es = ["ый", "ой", "ая", "ое", "ые", "ого", "ому", "ым", "ую", "ом", "ых", "ыми", "ою", "о", "а", "ы"]
                  return [s + e for e in es]
              if l.endswith("ий"):
                  s = l[:-2]
                  if s[-1] in "гкхжшчщ":
                      es = ["ий", "ая", "ое", "ие", "ого", "ому", "им", "ой", "ую", "ом", "их", "ими", "о", "а", "и"]
                  else:
                      es = ["ий", "яя", "ее", "ие", "его", "ему", "им", "ей", "юю", "ем", "их", "ими", "е"]
                  return [s + e for e in es]
              if l.endswith(("ая", "ое")): return [l]
              return [l]

          ru = []
          seen = set()
          def add(ws):
              for w in ws:
                  if w not in seen and re.fullmatch(r"[а-яё\-]{1,30}", w):
                      seen.add(w); ru.append(w)

          # interleave by frequency: plain words first, then lemma families (lists already roughly ordered by frequency)
          add(RU_PLAIN)
          fam = []
          lists = [(NOUN_M, noun_m), (NOUN_F, noun_f), (NOUN_N, noun_n), (ADJ, adj), (VERBS, verb_forms)]
          maxlen = max(len(l) for l, _ in lists)
          for i in range(maxlen):
              for l, fn in lists:
                  if i < len(l):
                      add(fn(l[i]))
          open(OUT + "dict_ru.txt", "w", encoding="utf-8").write("\n".join(ru) + "\n")
          print("RU", len(ru))

          PYEOF
          python3 gen_dict.py

