      - name: Generate dictionaries
        run: |
          sudo apt-get install -y hunspell-en-us > /dev/null
          cd proj
          mkdir -p app/src/main/assets
          python3 gen_dict.py

      - name: Build release APK
        run: cd proj && gradle :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KochKeyboard-apk
          path: proj/app/build/outputs/apk/release/*.apk
