      - name: Generate dictionaries
        run: |
          sudo apt-get update -y > /dev/null || true
          sudo apt-get install -y hunspell-en-us > /dev/null
          sudo apt-get install -y hunspell-ru > /dev/null || echo "no hunspell-ru"
          sudo apt-get install -y hunspell-tools > /dev/null || echo "no hunspell-tools"
          ls /usr/share/hunspell | head -20
          cd proj
          mkdir -p app/src/main/assets
          python3 gen_dict.py

      - name: Restore signing key (GitHub Secrets, optional)
        env:
          KOCH_KEYSTORE_B64: ${{ secrets.KOCH_KEYSTORE_B64 }}
        run: |
          if [ -n "$KOCH_KEYSTORE_B64" ]; then
            echo "$KOCH_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/koch.jks"
            echo "KOCH_STORE_FILE=$RUNNER_TEMP/koch.jks" >> "$GITHUB_ENV"
            echo "Signing: GitHub Secrets" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Signing: built-in legacy key (add KOCH_KEYSTORE_B64 secret)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: cd proj && gradle :app:testDebugUnitTest --no-daemon

      - name: Lint
        id: lint
        continue-on-error: true
        run: cd proj && gradle :app:lintDebug --no-daemon

      - name: Build debug APK
        run: cd proj && gradle :app:assembleDebug --no-daemon

      - name: Build release APK
        env:
          KOCH_STORE_PASS: ${{ secrets.KOCH_STORE_PASS }}
          KOCH_KEY_ALIAS: ${{ secrets.KOCH_KEY_ALIAS }}
          KOCH_KEY_PASS: ${{ secrets.KOCH_KEY_PASS }}
        run: cd proj && gradle :app:assembleRelease --no-daemon

      - name: Summary
        if: always()
        run: |
          echo "Tests: ${{ steps.tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Lint: ${{ steps.lint.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          ls -la proj/app/build/outputs/apk/*/ >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        with:
          name: KochKeyboard-release-apk
          path: proj/app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KochKeyboard-debug-apk
          path: proj/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            proj/app/build/reports/
          if-no-files-found: ignore
