g anything nothing everything someone anyone everyone myself yourself himself herself themselves whatever however although though whether under phone message text email app internet video photo music food coffee tea beer lunch dinner breakfast sleep dream movie song party weekend birthday school student class college university morning evening afternoon sunday monday tuesday wednesday thursday friday saturday january february march april may june july august september october november december""".split()
          en_common = []
          for w in EN_COMMON:
              if w not in en_common: en_common.append(w)

          rules = {}
          for line in open("/usr/share/hunspell/en_US.aff", encoding="utf-8", errors="ignore"):
              p = line.split()
              if len(p) >= 5 and p[0] == "SFX" and p[1] in "SDGRY":
                  strip = "" if p[2] == "0" else p[2]
                  add = "" if p[3] == "0" else p[3]
                  cond = p[4]
                  rules.setdefault(p[1], []).append((strip, add, re.compile(("." if cond == "." else cond) + "$")))

          rest = set()
          for line in open("/usr/share/hunspell/en_US.dic", encoding="utf-8", errors="ignore").read().splitlines()[1:]:
              word, _, flags = line.partition("/")
              if not re.fullmatch(r"[a-z]{2,15}", word): continue
              rest.add(word)
              for f in flags:
                  for strip, add, rx in rules.get(f, []):
                      if rx.search(word) and word.endswith(strip):
                          w2 = word[: len(word) - len(strip)] + add
                          if re.fullmatch(r"[a-z]{2,16}", w2): rest.add(w2)
          rest -= set(en_common)
          en = en_common + sorted(rest, key=lambda w: (len(w), w))
          open(OUT + "dict_en.txt", "w", encoding="utf-8").write("\n".join(en) + "\n")
