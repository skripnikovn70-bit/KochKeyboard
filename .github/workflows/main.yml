      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Unpack project (embedded)
        run: |
          mkdir proj && cd proj
          echo '' | base64 -d | tar xz
          mv KochKeyboard/* KochKeyboard/.gitignore . && rmdir KochKeyboard
          ls

